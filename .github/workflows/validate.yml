name: Validate collections

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # Validator is stdlib-only; no dependencies to install.
      - name: Validate collections data
        run: python3 scripts/validate_collections.py --strict --require-tags
      # Per-collection contentHash/bytes in the index must match the files on
      # disk, or progressive-download clients fetch the wrong deltas.
      - name: Check index hashes are current
        run: python3 scripts/compute_hashes.py --check
      # The featured rotation names collections and quotes by id; a rename or a
      # removed quote turns a scheduled week into a blank one at release time.
      - name: Check the featured schedule
        run: python3 scripts/build_featured.py --check
      # The release regenerates every feed before it builds dist/, so a change
      # that breaks a builder would otherwise pass PR CI and fail at release —
      # after the tag is pushed, which is the expensive place to find out. Note
      # this also covers build_featured.py's *write* path: --check above returns
      # before it writes anything. Outputs are gitignored build artifacts.
      - name: Build the generated feeds and manifest
        run: |
          set -euo pipefail
          python3 scripts/build_recently_added.py
          python3 scripts/build_new_collections.py
          python3 scripts/build_on_this_day.py
          python3 scripts/build_newsletter_picks.py
          python3 scripts/build_featured.py
          python3 scripts/build_search_index.py
          python3 scripts/build_manifest.py 0.0.0 > /dev/null
